<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Always Beside You | Likkle Poop</title>
  <style>
    :root {
      --bg-gradient-start: #0f140e;
      --bg-gradient-end: #1b2618;
      --olive-primary: #8a9a5b;
      --olive-light: #b5c48c;
      --olive-glow: rgba(138, 154, 91, 0.4);
      --tulip-pink: #d88099;
      --tulip-glow: rgba(216, 128, 153, 0.5);
      --text-main: #f0f4ed;
      --text-muted: #a3b19b;
      --glass-bg: rgba(25, 35, 23, 0.65);
      --glass-border: rgba(181, 196, 140, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Canvas */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: auto;
    }

    /* UI Layout Overlay */
    .app-container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 80px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding: 10px 0;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--olive-light);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Glass Panels */
    .panel {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Comfort Action Button */
    .comfort-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--olive-primary), #556b2f);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px var(--olive-glow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .comfort-btn:active {
      transform: scale(0.98);
    }

    /* Constellation Card Display */
    .memory-card {
      display: none;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.4s ease-out;
      border-left: 3px solid var(--tulip-pink);
    }

    .memory-card.active {
      display: flex;
    }

    .memory-quote {
      font-size: 1.05rem;
      font-style: italic;
      color: #fff;
      line-height: 1.4;
    }

    .memory-note {
      font-size: 0.85rem;
      color: var(--olive-light);
    }

    /* Conversation / Write Back Section */
    .chat-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-section h2 {
      font-size: 1.1rem;
      color: var(--olive-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prompt-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
    }

    .chip {
      background: rgba(138, 154, 91, 0.15);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chip:active {
      background: var(--olive-primary);
      color: #fff;
    }

    .chat-timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.4;
      animation: fadeIn 0.3s ease;
    }

    .bubble.user {
      align-self: flex-end;
      background: rgba(138, 154, 91, 0.25);
      border: 1px solid var(--glass-border);
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    .bubble.brother {
      align-self: flex-start;
      background: rgba(216, 128, 153, 0.18);
      border: 1px solid rgba(216, 128, 153, 0.3);
      border-bottom-left-radius: 4px;
      color: #fff;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .chat-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background: var(--olive-primary);
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }

    /* Secret Audio Player Component */
    .audio-player-card {
      display: none;
      background: rgba(216, 128, 153, 0.12);
      border: 1px solid rgba(216, 128, 153, 0.3);
      border-radius: 14px;
      padding: 12px;
      margin-top: 8px;
      animation: fadeIn 0.4s ease;
    }

    .audio-player-card.active {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .audio-info {
      font-size: 0.8rem;
      color: var(--tulip-pink);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    audio {
      width: 100%;
      height: 32px;
      border-radius: 8px;
    }

    /* Photo Lightbox Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      position: relative;
      max-width: 450px;
      width: 100%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
    }

    .modal-caption {
      padding: 16px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .modal-nav {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 0 16px 16px 16px;
    }

    .modal-btn {
      background: rgba(138, 154, 91, 0.3);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Background Stars & Birds Canvas -->
  <canvas id="canvas-container"></canvas>

  <div class="app-container">
    <header>
      <h1>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a7 7 0 0 1 7 7c0 5.25-7 13-7 13S5 14.25 5 9a7 7 0 0 1 7-7z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
        Always Beside You
      </h1>
      <p>Tap a star or floating songbird above • Likkle Poop</p>
    </header>

    <!-- Instant Comfort Button -->
    <button class="comfort-btn" onclick="triggerRandomMemory()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
      I Need To Hear From You
    </button>

    <!-- Memory Card Display -->
    <div id="memoryCard" class="panel memory-card">
      <div class="memory-quote" id="memoryQuote">""</div>
      <div class="memory-note" id="memoryNote"></div>
    </div>

    <!-- Write Back Conversation Journal -->
    <div class="panel chat-section">
      <h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Write Back To Him
      </h2>

      <div class="prompt-chips">
        <div class="chip" onclick="sendQuickPrompt('Someone is bothering me')">Someone is bothering me</div>
        <div class="chip" onclick="sendQuickPrompt('Are you safe?')">Are you safe?</div>
        <div class="chip" onclick="sendQuickPrompt('I don\'t feel pretty today')">I don't feel pretty today</div>
        <div class="chip" onclick="sendQuickPrompt('I miss your voice')">I miss your voice</div>
      </div>

      <div class="chat-timeline" id="chatTimeline">
        <div class="bubble brother">
          Hey likkle poop. Any time you miss me, just leave a message here. I'm always watching out for you.
        </div>
      </div>

      <!-- Secret Audio Player Container -->
      <div id="audioPlayerCard" class="audio-player-card">
        <div class="audio-info">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <span id="audioTitle">Playing Voice Note...</span>
        </div>
        <audio id="secretAudio" controls></audio>
      </div>

      <div class="chat-input-row">
        <input type="text" id="chatInput" class="chat-input" placeholder="Talk to him... (likkle poop)" onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Photo Gallery Lightbox Modal -->
  <div class="modal-overlay" id="photoModal">
    <div class="modal-content">
      <button class="close-modal" onclick="closePhotoModal()">✕</button>
      <img id="modalImage" class="modal-img" src="" alt="Brother Photo">
      <div class="modal-caption" id="modalCaption"></div>
      <div class="modal-nav">
        <button class="modal-btn" onclick="prevPhoto()">Previous</button>
        <button class="modal-btn" onclick="nextPhoto()">Next</button>
      </div>
    </div>
  </div>

  <script>
    /* DATA CONFIGURATION WITH YOUR EXACT AUDIO FILES */
    const BROTHER_MESSAGES = [
      { quote: "You'll be okay just make sure your safe", note: "Always keeping you protected." },
      { quote: "Make sure you okay enuh cause you know me we shell dung e place Fi u", note: "He's always in your corner, ready to fight for you." },
      { quote: "You'll be fine you can do all things through Christ who strengthens you", note: "His quiet faith in you when you need strength." },
      { quote: "Alright me likkle poop", note: "His favorite nickname for you." },
      { quote: "Girl your in Foriengg what kind of headache you feeling in forieghn", note: "Checking up on you across the distance." },
      { quote: "Thanks love u lil sis", note: "Simple, pure love." },
      { quote: "Yeah mn me safe me baby", note: "Reassuring you that he's at peace." },
      { quote: "Me pretty sister", note: "Reminding you of who you are." },
      { quote: "You'll be fine man, don't stress yourself.", note: "Calming your worries." },
      { quote: "I've got you always, likkle poop.", note: "Forever by your side." }
    ];

    const BROTHER_PHOTOS = [
      { url: 'photos/photo1.jpg', caption: 'Forever in your heart.' },
      { url: 'photos/photo2.jpg', caption: 'Always watching over you, likkle poop.' },
      { url: 'photos/photo3.jpg', caption: 'Your pretty sister protector.' }
    ];

    const VOICE_NOTES = [
      { trigger: ['miss your voice', 'voice note', 'listen', 'hear you'], url: 'audio/AUD-20261105-WA0029.opus', title: 'Voice Note From Him' },
      { trigger: ['shell dung', 'bothering', 'protect'], url: 'audio/AUD-20260516-WA0000.opus', title: 'Voice Note From Him' },
      { trigger: ['safe', 'are you safe'], url: 'audio/AUD-20261105-WA0030.opus', title: 'Voice Note From Him' }
    ];

    /* AUDIO SYNTHESIS FOR CHIMES */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playChime(freq = 440) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.2);
    }

    /* CANVAS ANIMATION: STARS & BIRDS */
    const canvas = document.getElementById('canvas-container');
    const ctx = canvas.getContext('2d');
    let width, height;
    let stars = [];
    let birds = [];

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Star {
      constructor(index) {
        this.index = index;
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * (height * 0.55);
        this.size = Math.random() * 2.5 + 1.5;
        this.alpha = Math.random() * 0.8 + 0.2;
        this.speed = Math.random() * 0.01 + 0.005;
      }
      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(216, 128, 153, ${this.alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#d88099';
        ctx.fill();
        ctx.restore();
      }
      update() {
        this.alpha += Math.sin(Date.now() * this.speed) * 0.01;
        if (this.alpha < 0.2) this.alpha = 0.2;
      }
    }

    class Bird {
      constructor(index) {
        this.index = index;
        this.reset();
      }
      reset() {
        this.x = -20 - Math.random() * 100;
        this.y = Math.random() * (height * 0.4) + 40;
        this.speed = Math.random() * 0.6 + 0.4;
        this.size = Math.random() * 12 + 16;
        this.wingAngle = 0;
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.strokeStyle = '#b5c48c';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const wingY = Math.sin(this.wingAngle) * 8;
        ctx.moveTo(-this.size/2, wingY);
        ctx.quadraticCurveTo(-this.size/4, -this.size/2, 0, 0);
        ctx.quadraticCurveTo(this.size/4, -this.size/2, this.size/2, wingY);
        ctx.stroke();
        ctx.restore();
      }
      update() {
        this.x += this.speed;
        this.wingAngle += 0.08;
        if (this.x > width + 40) this.reset();
      }
    }

    for (let i = 0; i < 10; i++) stars.push(new Star(i));
    for (let i = 0; i < 3; i++) birds.push(new Bird(i));

    function animateCanvas() {
      ctx.clearRect(0, 0, width, height);
      stars.forEach(s => { s.update(); s.draw(); });
      birds.forEach(b => { b.update(); b.draw(); });
      requestAnimationFrame(animateCanvas);
    }
    animateCanvas();

    /* INTERACTIVE CANVAS TAPS */
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      // Check bird tap -> Open Photos
      for (let bird of birds) {
        if (Math.hypot(bird.x - clickX, bird.y - clickY) < 30) {
          playChime(587.33);
          openPhotoModal(bird.index % BROTHER_PHOTOS.length);
          return;
        }
      }

      // Check star tap -> Show Constellation Memory
      for (let star of stars) {
        if (Math.hypot(star.x - clickX, star.y - clickY) < 25) {
          playChime(523.25);
          showMemory(star.index);
          return;
        }
      }
    });

    /* MEMORY DISPLAY LOGIC */
    function showMemory(index) {
      const item = BROTHER_MESSAGES[index % BROTHER_MESSAGES.length];
      const card = document.getElementById('memoryCard');
      document.getElementById('memoryQuote').innerText = `"${item.quote}"`;
      document.getElementById('memoryNote').innerText = item.note;
      card.classList.add('active');
    }

    function triggerRandomMemory() {
      playChime(659.25);
      const randomIndex = Math.floor(Math.random() * BROTHER_MESSAGES.length);
      showMemory(randomIndex);
    }

    /* CONVERSATION JOURNAL LOGIC */
    function sendQuickPrompt(text) {
      document.getElementById('chatInput').value = text;
      sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const val = input.value.trim();
      if (!val) return;

      const timeline = document.getElementById('chatTimeline');
      
      // Append user message
      const userBubble = document.createElement('div');
      userBubble.className = 'bubble user';
      userBubble.innerText = val;
      timeline.appendChild(userBubble);
      input.value = '';
      timeline.scrollTop = timeline.scrollHeight;

      // Check for secret voice note trigger
      let matchedVoice = VOICE_NOTES.find(v => v.trigger.some(t => val.toLowerCase().includes(t)));
      
      setTimeout(() => {
        playChime(440);
        const brotherBubble = document.createElement('div');
        brotherBubble.className = 'bubble brother';
        brotherBubble.innerText = getBrotherResponse(val);
        timeline.appendChild(brotherBubble);
        timeline.scrollTop = timeline.scrollHeight;

        if (matchedVoice) {
          triggerAudioPlayer(matchedVoice);
        }
      }, 700);
    }

    function getBrotherResponse(text) {
      const lower = text.toLowerCase();
      if (lower.includes('bother') || lower.includes('headache') || lower.includes('mad')) {
        return "Make sure you okay enuh cause you know me we shell dung e place Fi u. Don't let nobody stress you out, likkle poop.";
      }
      if (lower.includes('safe')) {
        return "Yeah mn me safe me baby. You make sure you stay safe too, alright?";
      }
      if (lower.includes('pretty') || lower.includes('ugly') || lower.includes('sad')) {
        return "Me pretty sister! You'll be fine, you can do all things through Christ who strengthens you.";
      }
      if (lower.includes('foreign') || lower.includes('away') || lower.includes('travel')) {
        return "Girl your in Foriengg what kind of headache you feeling in forieghn? Don't stress yourself.";
      }
      return "You'll be okay just make sure your safe, likkle poop. Thanks love u lil sis.";
    }

    function triggerAudioPlayer(voiceObj) {
      const card = document.getElementById('audioPlayerCard');
      const audio = document.getElementById('secretAudio');
      document.getElementById('audioTitle').innerText = voiceObj.title;
      audio.src = voiceObj.url;
      card.classList.add('active');
      audio.play().catch(() => {});
    }

    /* PHOTO MODAL LOGIC */
    let currentPhotoIdx = 0;
    function openPhotoModal(idx) {
      currentPhotoIdx = idx;
      updateModalPhoto();
      document.getElementById('photoModal').classList.add('active');
    }

    function closePhotoModal() {
      document.getElementById('photoModal').classList.remove('active');
    }

    function updateModalPhoto() {
      const photo = BROTHER_PHOTOS[currentPhotoIdx];
      document.getElementById('modalImage').src = photo.url;
      document.getElementById('modalCaption').innerText = photo.caption;
    }

    function nextPhoto() {
      currentPhotoIdx = (currentPhotoIdx + 1) % BROTHER_PHOTOS.length;
      updateModalPhoto();
    }

    function prevPhoto() {
      currentPhotoIdx = (currentPhotoIdx - 1 + BROTHER_PHOTOS.length) % BROTHER_PHOTOS.length;
      updateModalPhoto();
    }
  </script>
</body>
</html>
